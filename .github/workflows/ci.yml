name: CI

on:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ["1.24.0", "2.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==${{ matrix.numpy-version }}" scipy==1.15.3 matplotlib==3.10.9 pytest==9.2.0
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Run example smoke test
        run: python examples/basin_hopping_lj13.py --steps 2
